name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (validate only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hermes-no-dashboard:ci
